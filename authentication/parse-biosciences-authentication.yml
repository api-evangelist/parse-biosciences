summary: >-
  Parse Biosciences publishes no developer API and therefore no developer authentication
  documentation. It does operate one authenticated HTTP surface: the backend of Trailmaker,
  its cloud single-cell data-analysis application. That backend is protected by AWS Cognito
  (OIDC) and requires a bearer token; there is no public reference, no key-issuance flow, and
  no published contract for it. Everything below was observed anonymously — no credentials
  were used and no access control was defeated.

