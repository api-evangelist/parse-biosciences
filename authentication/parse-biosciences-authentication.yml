user_facing_credentials:
  - name: Trailmaker upload token
    description: >-
      Parse's Support Suite documents a command-line FASTQ upload path in which the user
      downloads a "parse-upload" Python script from Trailmaker, generates a token in the
      Trailmaker UI, and pastes the generated command into a console. The token is generated
      per-session inside the signed-in application; neither the script nor a token format is
      published at a public URL, and no token values are recorded here.
    source: >-
      https://support.parsebiosciences.com/hc/en-us/articles/27076682137236-Trailmaker-User-Guide
    public: false

notes:
  - >-
    Trailmaker is a deployment of the open-source Cellenics/Biomage single-cell platform
    (github.com/hms-dbmi-cellenics). The evidence is in Parse's own served config: the Cognito
    hosted-UI domain is literally biomage-auth-production-242905224710, analytics point at
    biomage.matomo.cloud, and the Trailmaker course site is biomage-s-site.thinkific.com. The
    upstream project publishes an OpenAPI for this API — but that spec belongs to Cellenics
    (info.title "API", contact.name "Cellenics", MIT, servers "/v2", hosted in the HMS DBMI
    org), not to Parse Biosciences, so it is deliberately NOT harvested into this repo. See
    the ownership note in conventions/parse-biosciences-conventions.yml.
