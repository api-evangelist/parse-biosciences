aid: parse-biosciences
name: Parse Biosciences
description: >-
  Parse Biosciences is a Seattle-based life-sciences company that makes Evercode, a
  split-pool combinatorial barcoding chemistry for single cell and single nuclei RNA
  sequencing that runs on standard lab equipment rather than a dedicated microfluidics
  instrument. Its product line spans Evercode WT Mini, WT, WT Mega and WT Penta whole
  transcriptome kits, Evercode TCR and BCR immune profiling, Evercode Fixation, Evercode
  WT FFPE, Gene Select and CRISPR Detect, alongside a GigaLab sequencing service for
  10M+ cell projects. Data analysis is delivered through Trailmaker, a cloud application
  that takes Evercode FASTQ files through a pipeline and into interactive downstream
  analysis. Parse publishes no public developer API, SDK, or machine-readable API
  contract; Trailmaker is an end-user web application whose backend is authenticated with
  AWS Cognito and undocumented outside the product.
