reversibility:
  grade: na
  reason: >-
    Parse Biosciences exposes no public write surface. Trailmaker is an authenticated
    end-user application; there is no documented programmatic action for an agent to take,
    and therefore no reversal operation and no reversal window to record. `reversibility`,
    `dry_run_mode` and `idempotency` are all `na` here for the same reason, and an honest
    `na` leaves the denominator rather than scoring zero.
  write_surfaces: []
