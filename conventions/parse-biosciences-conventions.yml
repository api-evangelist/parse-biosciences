    No reversal window is asserted. The Trailmaker UI does let a signed-in user delete
    projects and samples, but no window is stated in any public document, so none is recorded.

ownership_finding:
  title: Trailmaker is a Cellenics deployment — the upstream OpenAPI is NOT Parse's contract
  what_we_found: >-
    Trailmaker is a deployment of the open-source Cellenics single-cell platform maintained at
    github.com/hms-dbmi-cellenics (formerly Biomage Ltd, github.com/biomage-org). Parse's own
    served application config gives it away: the Cognito hosted-UI domain is
    biomage-auth-production-242905224710.auth.eu-west-1.amazoncognito.com, analytics point at
    biomage.matomo.cloud, the Trailmaker course site is biomage-s-site.thinkific.com, and the
    Redux store shipped in /landing matches the Cellenics UI store key-for-key (with a
    Parse-specific `parseExperimentType` field added).
  the_upstream_spec: >-
    hms-dbmi-cellenics/api publishes src/specs/api.v2.yaml — a real OpenAPI 3.0.0 describing
    exactly the /v2 routes Parse's backend serves (/v2/experiments, /v2/workRequest,
    /v2/access, /v2/secondaryAnalysis and the rest, all of which appear in Trailmaker's own
    bundle).
  why_it_was_not_saved: >-
    It fails the STEP 0c ownership check. The spec says about itself: info.title "API",
    info.description "The main Node.js pipeline API.", contact.name "Cellenics", license MIT
    pointing at github.com/hms-dbmi-cellenics/api/blob/master/LICENSE, servers "/v2". It is
    hosted in a third party's repository and names a third party as its owner. Saving it into
    openapi/ would credit Parse Biosciences with publishing a contract it did not publish and
    does not maintain, and every derived artifact would inherit that wrong provenance. The
    honest record is "no published contract found".
  evidence:
    - url: https://app.trailmaker.parsebiosciences.com/landing
      status: 200
    - url: https://raw.githubusercontent.com/hms-dbmi-cellenics/api/master/src/specs/api.v2.yaml
      status: 200
    - url: https://api.app.trailmaker.parsebiosciences.com/v2/experiments/examples
      status: 401

