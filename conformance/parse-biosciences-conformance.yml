generated: '2026-08-26'
method: probed
source: >-
  Anonymous probes of Parse Biosciences hosts on 2026-08-26 plus the Cognito OIDC discovery
  document referenced by Trailmaker's own served application config. No OpenAPI, AsyncAPI,
  GraphQL SDL, MCP manifest, .proto or WSDL was found on any Parse-controlled host, so
  nothing here is derived from a contract.

scope: >-
  Parse Biosciences publishes no machine-readable API contract, so most cross-cutting
  standards are not applicable rather than failed. The single standard that can be asserted
  from evidence is OpenID Connect, and it is asserted about Trailmaker's authentication
  layer, not about a developer API.

standards:
  - id: oidc
    name: OpenID Connect Discovery 1.0
    conforms: true
    scope: Trailmaker application sign-in (not a developer API)
    evidence:
      - >-
        https://cognito-idp.eu-west-1.amazonaws.com/eu-west-1_eYTCV3Nl7/.well-known/openid-configuration
        returns 200 with issuer, authorization_endpoint, token_endpoint, userinfo_endpoint,
        jwks_uri, revocation_endpoint and end_session_endpoint. The pool is the one named in
        Trailmaker's own __NEXT_DATA__ amplifyConfig at
        https://app.trailmaker.parsebiosciences.com/landing.
    note: >-
      The discovery document is served by AWS Cognito, an infrastructure provider, not by a
      Parse host. Parse configured the pool; it did not author or publish the document.

  - id: oauth2
    name: OAuth 2.0 (authorization code)
    conforms: true
    scope: Trailmaker application sign-in
    evidence:
      - >-
        responseType "code" and authenticationFlowType "USER_SRP_AUTH" in the served
        amplifyConfig; token_endpoint_auth_methods_supported [client_secret_basic,
        client_secret_post] in the discovery document.
    note: >-
      This is end-user sign-in to a web application. There is no client-credentials flow, no
      published scope reference, and no third-party app registration.

  - id: openapi
    name: OpenAPI
    conforms: false
    evidence:
      - 'https://api.app.trailmaker.parsebiosciences.com/v2/openapi.json -> 404 {"message":"not found"}'
      - https://api.app.trailmaker.parsebiosciences.com/openapi.json -> 404
      - https://app.trailmaker.parsebiosciences.com/openapi.json -> 404
      - https://www.parsebiosciences.com/openapi.json -> 404

  - id: rfc9457
    name: RFC 9457 Problem Details
    conforms: false
    evidence:
      - >-
        The only error bodies observable anonymously are bare JSON objects
        ({"message":"The request does not contain an authentication token."},
        {"message":"not found"}) served as application/json, not application/problem+json.

  - id: rfc9116
    name: RFC 9116 security.txt
    conforms: false
    evidence:
      - /.well-known/security.txt returned 404 on all four reachable Parse hosts

  - id: rfc8594
    name: RFC 8594 Sunset header
    conforms: false
    evidence:
      - No deprecation or sunset policy published; no Sunset/Deprecation headers observed.

  - id: idempotency
    name: Idempotency keys
    conforms: false
    evidence:
      - No public documentation and no contract in which to declare an idempotency header.

  - id: pagination
    name: Documented pagination
    conforms: false
    evidence:
      - No public API reference exists to document a pagination convention.

  - id: asyncapi
    name: AsyncAPI
    conforms: false
    applicable: false
    evidence:
      - >-
        No webhook, event, or streaming surface is documented or advertised anywhere on
        parsebiosciences.com or in the Trailmaker application shell.

  - id: a2a
    name: A2A Agent Card
    conforms: false
    evidence:
      - /.well-known/agent-card.json and /.well-known/agent.json returned 404 on every host

  - id: mcp
    name: Model Context Protocol
    conforms: false
    evidence:
      - 'POST https://api.app.trailmaker.parsebiosciences.com/mcp -> 404 "Cannot POST /mcp"'
      - mcp.parsebiosciences.com does not resolve in DNS

domain_standards:
  checked:
    - id: hl7v2
      applicable: false
      note: Research reagent and analysis vendor, not a clinical data exchange participant.
    - id: fhir
      applicable: false
      note: No clinical or EHR surface.
    - id: ga4gh
      name: GA4GH (htsget / DRS / TES / WES)
      conforms: false
      note: >-
        GA4GH standards are the relevant genomics-domain family for a platform that ingests
        FASTQ and serves analysis results. Trailmaker declares none of them, and no GA4GH
        endpoint shape appears at api.app.trailmaker.parsebiosciences.com. Recorded as a real
        gap in an applicable domain, not as a penalty.
    - id: ome-ngff
      applicable: false
      note: Imaging standard; Trailmaker is transcriptomics, not microscopy.
  declared: []
  note: >-
    domain_standard_conformance is reward-only. Parse Biosciences declares no domain standard
    in any contract because it publishes no contract. Nothing is invented to fill the slot.

compliance_certifications: []
